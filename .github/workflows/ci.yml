name: CI

# 触发时机：推送到 main、或对 main 发起 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时取消上一次未完成的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  # 脚本式布局（非可安装包）：让 `pytest tests/` 能找到 src 包。
  # tests/conftest.py 也会注入一次，这里是双保险。
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # --------------------------------------------------------------------------
  # job 1：静态检查。只装 ruff，秒级完成。
  # --------------------------------------------------------------------------
  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.7.4
      - name: ruff 静态检查
        run: ruff check . --output-format=github
      - name: ruff 格式检查
        run: ruff format --check .

  # --------------------------------------------------------------------------
  # job 2：单元测试。
  #
  # 关键取舍：CI 里**不装 torch / lightgbm**。
  #   - torch 约 2.5 GB，光下载就要十几分钟，而本项目的单元测试
  #     全部用合成数据验证"窗口构造 / 时间切分 / 指标"逻辑，不需要它；
  #   - 需要真实数据与模型权重的训练/对比脚本（03b/04/05）不进 CI，
  #     由开发者在本地 GPU 上运行（README 有说明）。
  #   因此 CI 只需 numpy + pandas + pytest，1 分钟内跑完。
  # --------------------------------------------------------------------------
  test:
    name: 单元测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装最小测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<2" "pandas>=2,<3" "pytest>=8,<9" "pytest-cov>=6,<8" "pyyaml>=6,<7"
      - name: 运行单元测试
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

  # --------------------------------------------------------------------------
  # job 3：依赖可安装性检查（只在 main 上跑）。
  #   用 --dry-run 只做解析不真正下载，几十秒内发现版本冲突。
  # --------------------------------------------------------------------------
  install-check:
    name: 依赖可安装性检查（pip dry-run）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 解析 requirements.txt（不实际安装）
        run: pip install --dry-run --quiet -r requirements.txt
      - name: 解析 requirements-dev.txt（不实际安装）
        run: pip install --dry-run --quiet -r requirements-dev.txt
