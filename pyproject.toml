# ============================================================
# 项目元信息与 pytest 配置
# ============================================================

[project]
name = "pv-power-forecast-transformer"
version = "0.1.0"
description = "基于时序 Transformer 的光伏发电功率预测（本科毕业设计）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["time-series", "forecasting", "transformer", "solar", "pytorch", "lightgbm"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
# 显式指定测试目录，避免 pytest 扫描到 archive/、models/ 等数据目录
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:lightgbm.*",
]

[tool.coverage.run]
source = ["src"]
# src/models.py 依赖 torch（约 2.5 GB），CI 里刻意不装。
# 该模块被排除出覆盖率口径，理由：
#   1. 无 torch 时它完全不被导入，215 行全记 missing，会把覆盖率
#      拉到 31%，让"纯逻辑模块"的真实覆盖水平被淹没；
#   2. 其正确性由 tests/test_models.py 的形状契约测试守护
#      （输出形状、蒸馏减半、权重往返、参数校验），本地 GPU 环境运行。
# 覆盖率口径因此聚焦 data/config/logger 三个纯逻辑模块。
omit = ["src/models.py"]

[tool.coverage.report]
# CI（无 torch）与本地（有 torch）口径一致：排除 models.py 后约 99%。
# 门槛取 70，留出余量。
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
